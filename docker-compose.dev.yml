services:
  postgres:
    container_name: wishapp-dev-postgres
    image: postgres:16
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    container_name: wishapp-dev-minio
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    container_name: wishapp-dev-minio-init
    image: minio/mc
    env_file:
      - .env.dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${ObjectStorage__BucketName} &&
      mc anonymous set download local/$${ObjectStorage__BucketName}
      "
    restart: on-failure

  migrator:
    container_name: wishapp-dev-migrator
    build:
      context: .
      dockerfile: Wishapp.Web/Dockerfile
      target: migrator
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  seq:
    container_name: wishapp-dev-seq
    image: datalust/seq:latest
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - dev_seq_data:/data

  mailpit:
    container_name: wishapp-dev-mailpit
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    container_name: wishapp-dev-backend
    build:
      context: .
      dockerfile: Wishapp.Web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  frontend:
    container_name: wishapp-dev-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_STORAGE_URL: ${ObjectStorage__PublicUrl}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped

  nginx:
    container_name: wishapp-dev-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  dev_postgres_data:
  dev_minio_data:
  dev_seq_data:
