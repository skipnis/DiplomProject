services:
  postgres:
    container_name: wishapp-prod-postgres
    image: postgres:16
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - diplom_postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    container_name: wishapp-prod-migrator
    build:
      context: .
      dockerfile: Wishapp.Web/Dockerfile
      target: migrator
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  backend:
    container_name: wishapp-prod-backend
    build:
      context: .
      dockerfile: Wishapp.Web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  seq:
    container_name: wishapp-prod-seq
    image: datalust/seq:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:81:80"
    volumes:
      - diplom_seq_data:/data

  nginx:
    container_name: wishapp-prod-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_STORAGE_URL: ${ObjectStorage__PublicUrl}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  diplom_postgres_data:
  diplom_seq_data:
